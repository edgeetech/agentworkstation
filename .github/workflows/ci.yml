name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check architecture
        run: npm run check:architecture

      - name: Build renderer
        run: npm run build

      - name: Compile Electron main process
        run: npm run electron:build-main

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  macos-compat:
    name: macOS compatibility gate
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate unit/integration/security suites
        run: npm test -- tests/unit tests/integration tests/security

      - name: Check architecture
        run: npm run check:architecture

      - name: Build renderer
        run: npm run build

      - name: Compile Electron main process
        run: npm run electron:build-main
